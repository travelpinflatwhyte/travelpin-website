<style>
  :root {
    --ground: #F5F7F9;
    --surface: #FFFFFF;
    --ink: #101823;
    --ink-2: #58627A;
    --ink-3: #8A93A6;
    --navy: #011735;
    --rule: #DCE2EA;
    --rule-soft: #E9EDF2;
    --live: #15703F;
    --live-bg: #E7F2EB;
    --hold: #8A5206;
    --hold-bg: #F7EEDF;
    --flag: #7A2E12;
    --flag-bg: #F6E9E3;
    --fill: #EEF1F5;
    --display: "Newsreader", Georgia, serif;
    --body: "Source Sans 3", -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --caveat: "Caveat", cursive;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0A0E15; --surface: #141B25; --ink: #E9EDF3; --ink-2: #9BA5B8;
      --ink-3: #6E7889; --navy: #9FC0E6; --rule: #27313F; --rule-soft: #1C242F;
      --live: #63C08C; --live-bg: #102C1D; --hold: #D9A441; --hold-bg: #2E2313;
      --flag: #E08A66; --flag-bg: #2E1A12; --fill: #1B222D;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
  }
  .sheet {
    max-width: 800px;
    margin: 0 auto;
    padding: 36px 20px 64px;
  }
  .masthead {
    border-bottom: 2px solid var(--navy);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  .masthead-top {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    justify-content: space-between;
    align-items: baseline;
  }
  .wordmark {
    font-family: var(--caveat);
    font-size: 36px;
    font-weight: 600;
    color: var(--navy);
    letter-spacing: 0;
    line-height: 1;
  }
  .issue {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  h1 {
    font-family: var(--display);
    font-size: 21px;
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: -0.015em;
    margin: 14px 0 0;
    white-space: nowrap;
  }
  .byline {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 10px;
    letter-spacing: 0.04em;
  }
  .lede {
    font-family: var(--display);
    font-size: 17px;
    line-height: 1.45;
    color: var(--ink-2);
    margin: 0 0 8px;
  }
  section { margin-top: 32px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .eyebrow::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--rule);
  }
  h2 {
    font-family: var(--display);
    font-size: 21px;
    font-weight: 600;
    line-height: 1.25;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  p { margin: 0 0 10px; color: var(--ink-2); }
  p:last-child { margin-bottom: 0; }
  strong { color: var(--ink); font-weight: 600; }
  .chip {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 3px;
    vertical-align: 0.15em;
    margin-left: 8px;
    white-space: nowrap;
  }
  .chip.live { color: var(--live); background: var(--live-bg); }
  .chip.hold { color: var(--hold); background: var(--hold-bg); }

  .metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
  }
  .metric { background: var(--surface); padding: 12px 14px; }
  .metric dt {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 6px;
  }
  .metric dd { margin: 0; font-family: var(--mono); font-size: 13px; color: var(--ink-3); }
  .fillin {
    color: var(--flag);
    background: var(--flag-bg);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
  }
  .metrics-note {
    font-family: var(--display);
    font-size: 13px;
    font-style: italic;
    color: var(--ink-3);
    margin-top: 8px;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .grid-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .card {
    background: var(--surface);
    padding: 14px 16px;
  }
  .card h3 {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 8px;
  }
  .card p, .card li {
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--ink-2);
    margin: 0;
  }
  .card ul { margin: 0; padding: 0; list-style: none; }
  .card li { padding-left: 12px; position: relative; margin-bottom: 5px; }
  .card li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.65em;
    width: 5px;
    height: 1.5px;
    background: var(--ink-3);
  }
  .card li:last-child { margin-bottom: 0; }

  .kv {
    display: grid;
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
    margin: 12px 0;
  }
  .kv-row {
    display: grid;
    grid-template-columns: 88px 1fr;
    background: var(--surface);
  }
  .kv-row dt {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: 10px 12px;
    background: var(--fill);
    display: flex;
    align-items: center;
  }
  .kv-row dd {
    margin: 0;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--ink-2);
    line-height: 1.4;
  }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: var(--surface);
    margin: 10px 0 12px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 420px; }
  th {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--rule);
  }
  td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule-soft);
    color: var(--ink-2);
  }
  tr:last-child td { border-bottom: none; }
  td:first-child { color: var(--ink); font-weight: 600; white-space: nowrap; }
  td.num { font-family: var(--mono); font-size: 12.5px; }

  .steps {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
    margin: 10px 0 12px;
    counter-reset: step;
  }
  .step {
    background: var(--surface);
    padding: 12px 12px 14px;
  }
  .step::before {
    counter-increment: step;
    content: counter(step);
    font-family: var(--mono);
    font-size: 10px;
    color: var(--navy);
    display: block;
    margin-bottom: 6px;
  }
  .step strong {
    display: block;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .step span {
    font-size: 12.5px;
    color: var(--ink-2);
    line-height: 1.4;
  }

  .note {
    border-left: 2px solid var(--navy);
    padding: 2px 0 2px 16px;
    margin: 12px 0;
  }
  .note p {
    font-family: var(--display);
    font-size: 16px;
    line-height: 1.4;
    color: var(--ink);
    margin: 0;
  }

  .flagbox {
    background: var(--fill);
    border-radius: 4px;
    padding: 12px 14px;
    margin: 12px 0 0;
  }
  .flagbox p { font-size: 13.5px; margin: 0; }

  .stack {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
  }
  .layer { background: var(--surface); padding: 12px 14px; }
  .layer h4 {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 6px;
  }
  .layer p { margin: 0; font-size: 13px; line-height: 1.4; }

  ul.tight { margin: 0; padding: 0; list-style: none; }
  ul.tight li {
    position: relative;
    padding-left: 14px;
    margin-bottom: 7px;
    font-size: 14.5px;
    color: var(--ink-2);
  }
  ul.tight li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.7em;
    width: 6px;
    height: 1.5px;
    background: var(--ink-3);
  }

  .asks { counter-reset: ask; margin: 0; padding: 0; list-style: none; }
  .asks li {
    position: relative;
    padding-left: 32px;
    margin-bottom: 10px;
    font-size: 14.5px;
    color: var(--ink-2);
  }
  .asks li::before {
    counter-increment: ask;
    content: counter(ask);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--navy);
    background: var(--fill);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    left: 0;
    top: 0;
  }

  footer {
    margin-top: 40px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--ink-3);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    justify-content: space-between;
  }

  @media (max-width: 640px) {
    .metrics, .grid-2, .grid-3, .grid-4, .steps, .stack { grid-template-columns: 1fr 1fr; }
    .steps { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 420px) {
    .metrics, .grid-2, .grid-3, .grid-4, .steps, .stack { grid-template-columns: 1fr; }
    .kv-row { grid-template-columns: 1fr; }
    h1 { font-size: 18px; white-space: normal; }
  }

  .gate {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    background: var(--ground);
    padding: 24px;
  }
  .gate[hidden] { display: none; }
  .gate-card {
    width: min(360px, 100%);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 28px 24px 24px;
    text-align: center;
  }
  .gate-card .wm {
    font-family: var(--caveat);
    font-size: 34px;
    font-weight: 600;
    color: var(--navy);
    line-height: 1;
    margin-bottom: 8px;
  }
  .gate-card p {
    margin: 0 0 18px;
    font-size: 14px;
    color: var(--ink-2);
  }
  .gate-card input {
    width: 100%;
    font-family: var(--mono);
    font-size: 22px;
    letter-spacing: 0.35em;
    text-align: center;
    padding: 12px 10px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: var(--fill);
    color: var(--ink);
    outline: none;
  }
  .gate-card input:focus { border-color: var(--navy); }
  .gate-card button {
    margin-top: 12px;
    width: 100%;
    font-family: var(--body);
    font-size: 14px;
    font-weight: 600;
    padding: 11px 14px;
    border: none;
    border-radius: 6px;
    background: var(--navy);
    color: #fff;
    cursor: pointer;
  }
  .gate-card button:hover { opacity: 0.92; }
  .gate-err {
    margin-top: 10px;
    font-size: 13px;
    color: #B42318;
    min-height: 1.2em;
  }
  #secure-root[hidden] { display: none; }

</style>

<script>
(function () {
  const SESSION_KEY = "tp_update_sept2026_v4";
  const payload = JSON.parse(document.getElementById("secure-payload").textContent);
  const gate = document.getElementById("gate");
  const root = document.getElementById("secure-root");
  const form = document.getElementById("gate-form");
  const input = document.getElementById("gate-pin");
  const err = document.getElementById("gate-err");

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function deriveKey(pin, salt) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function unlock(pin) {
    const salt = b64ToBytes(payload.salt);
    const nonce = b64ToBytes(payload.nonce);
    const ct = b64ToBytes(payload.ct);
    const key = await deriveKey(pin, salt);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, key, ct);
    root.innerHTML = new TextDecoder().decode(plain);
    root.hidden = false;
    gate.hidden = true;
    try { sessionStorage.setItem(SESSION_KEY, pin); } catch (_) {}
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    const pin = (input.value || "").trim();
    if (!pin) { err.textContent = "Enter the access code"; return; }
    try { await unlock(pin); }
    catch (_) { err.textContent = "Incorrect code"; input.select(); }
  });

  (async function trySession() {
    let pin = null;
    try { pin = sessionStorage.getItem(SESSION_KEY); } catch (_) {}
    if (!pin) return;
    try { await unlock(pin); }
    catch (_) { try { sessionStorage.removeItem(SESSION_KEY); } catch (_) {} }
  })();
})();
</script>
